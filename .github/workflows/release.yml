name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Validate release tag and versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/verify-version.ps1

      - name: Run all tests
        run: npm test

      - name: Publish self-contained monitor
        run: npm run build:monitor

      - name: Build installer
        run: npm --prefix desktop run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Validate release package
        shell: pwsh
        run: |
          $installer = "artifacts/release/Computer-Monitor-Dashboard-Setup.exe"
          $service = "artifacts/release/win-unpacked/resources/monitor/ComputerMonitor.Service.exe"
          if (!(Test-Path $installer)) { throw "Release installer is missing." }
          if (!(Test-Path $service)) { throw "Self-contained monitor service is missing." }
          if ((Get-Item $installer).Length -lt 50MB) { throw "Installer is unexpectedly small." }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Computer Monitor Dashboard ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/release/Computer-Monitor-Dashboard-Setup.exe
