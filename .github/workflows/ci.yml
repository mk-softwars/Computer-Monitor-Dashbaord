name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Verify version consistency
        run: npm run verify:version

      - name: Run tests
        run: npm test

      - name: Publish self-contained monitor
        run: npm run build:monitor

      - name: Build Windows installer
        run: npm --prefix desktop run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Validate packaged runtime
        shell: pwsh
        run: |
          $installer = "artifacts/release/Computer-Monitor-Dashbaord-Setup.exe"
          $service = "artifacts/release/win-unpacked/resources/monitor/ComputerMonitor.Service.exe"
          $license = "artifacts/release/win-unpacked/resources/licenses/THIRD_PARTY_NOTICES.md"
          if (!(Test-Path $installer)) { throw "Installer was not produced." }
          if (!(Test-Path $service)) { throw "Monitor service is missing from the package." }
          if (!(Test-Path $license)) { throw "Third-party notices are missing from the package." }
          if ((Get-Item $installer).Length -lt 50MB) { throw "Installer is unexpectedly small." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Computer-Monitor-Dashboard-Windows-x64
          path: artifacts/release/Computer-Monitor-Dashbaord-Setup.exe
          if-no-files-found: error
          retention-days: 14
